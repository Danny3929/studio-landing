<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>Jenga Studios</title>
  <!-- Three rows of bricks, in the five palette colours. An asset file cannot use the page's CSS tokens, so the hex values are written out. -->

  <g stroke="#2b2623" stroke-width="1.2" stroke-linejoin="round">
    <rect x="12" y="4.5" width="8" height="7" rx="1.5" fill="#eadfc8" />
    <rect x="7.5" y="12.5" width="8" height="7" rx="1.5" fill="#2f4a3a" />
    <rect x="16.5" y="12.5" width="8" height="7" rx="1.5" fill="#b5502f" />
    <rect x="3.5" y="20.5" width="7.5" height="7" rx="1.5" fill="#b5502f" />
    <rect x="12.25" y="20.5" width="7.5" height="7" rx="1.5" fill="#eadfc8" />
    <rect x="21" y="20.5" width="7.5" height="7" rx="1.5" fill="#2f4a3a" />
  </g>
</svg>
